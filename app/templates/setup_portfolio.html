{% extends "setup_base.html" %}
{% set heading = "Your first portfolio" %}
{% block wizard %}

<form method="post" action="/setup/portfolio" class="panel">
  <input type="hidden" name="_csrf" value="{{ csrf }}">

  <label>Portfolio name
  {%- set name_tip %}
  <p>You can have more than one later — a family member's, or a separate
  strategy. This is just the first.</p>
  {% endset %}
  {% with body = name_tip, label = "About portfolios" %}
    {% include "_tip.html" %}
  {% endwith %}
    <input name="name" value="{{ name }}" required autofocus maxlength="80">
  </label>

  <label class="check">
    <input type="checkbox" name="price_feed" value="on" {% if price_feed %}checked{% endif %}>
    <span>Automatically refresh market data</span>
  {%- set feed_tip %}
  <p class="tipline">Refreshes public market data from Yahoo Finance.
  <a href="{{ docs_url }}/guides/market-data/">More information</a>.</p>
  {% endset %}
  {% with body = feed_tip, label = "What this sends" %}
    {% include "_tip.html" %}
  {% endwith %}
  </label>

  <label for="tzinput">Location and timezone</label>
  <div class="row">
    <input id="tzinput" name="timezone" list="zones" value="{{ timezone }}"
           required autocomplete="off" spellcheck="false">
    <button type="button" id="tzdetect" class="secondary">Use my browser's</button>
  </div>
  <datalist id="zones">
    {% for zone in zones %}<option value="{{ zone }}"></option>{% endfor %}
  </datalist>
  <p class="note" id="tzfound" hidden></p>

  <div class="commitbar">
    <button type="submit">Continue</button>
  </div>
</form>

<script src="/static/setup.js?v={{ asset_v }}" defer></script>
{% endblock %}
