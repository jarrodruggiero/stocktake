{# The change-password form. Shown in a dialog from the sign-in table, and
   inline inside <noscript> — one copy either way. #}
<form class="panel" method="post" action="/profile/password" autocomplete="on">
  <input type="hidden" name="_csrf" value="{{ auth.session.csrf_token }}">
  <label>Current password
    <input type="password" name="current_password" required autocomplete="current-password">
  </label>
  <label>New password <span class="sub">at least 10 characters</span>
    <input type="password" name="password" required minlength="10" autocomplete="new-password">
  </label>
  <label>Confirm new password
    <input type="password" name="confirm" required minlength="10" autocomplete="new-password">
  </label>
  <div class="commitbar">
    <button type="submit" class="primary">Change password</button>
    {% if in_dialog %}<button type="button" class="secondary" data-close-dialog>Cancel</button>{% endif %}
  </div>
</form>
