# SelfWealth — the "Movements" CSV export.
#
# Pinned by app/formats/samples/selfwealth.csv, which is synthetic: same
# headings and shapes as a real export, invented tickers and amounts. The
# previous version of this file named columns SelfWealth does not use, and said
# it had been verified — nothing checked that claim, which is why the sample
# now exists.
#
# If SelfWealth changes its headings, fix them HERE and open a pull request —
# the fix then reaches everyone rather than living in one person's config.
name: SelfWealth
kind: mapped
exchange: ASX
currency: AUD
# Dates arrive as "2024-02-13 00:00:00". A time on the end is tolerated by the
# importer, and a midnight one is discarded as the padding it is.
date_format: "%Y-%m-%d"
columns:
  date: Trade Date
  action: Action          # values read case-insensitively as buy / sell
  ticker: Code
  units: Units
  price: Average Price    # NOT "Consideration", which is units x price
  brokerage: Brokerage
