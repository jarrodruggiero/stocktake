# Local-dev CLI use only (e.g. `alembic revision --autogenerate`).
# In the container, appcore.upgrade_to_head() configures alembic
# programmatically at app startup — this file is not shipped/needed there.
# The DB URL comes from the app settings via migrations/env.py (set
# APP_CONFIG_FILE + APP_DATABASE__* env vars, as for running the app locally).

[alembic]
script_location = app/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
