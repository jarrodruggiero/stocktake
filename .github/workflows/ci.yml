# Lint and test every pull request, and every push to main that a pull
# request's run has not already tested (see the `tree` job).
#
# Written for the PUBLIC repository layout, where this app is the whole repo:
# `app/` and `tests/` sit at the root. Nothing here depends on
# self-hosted runners, a private registry, or any home infrastructure — it runs
# entirely on GitHub-hosted runners and public actions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether this exact tree has already passed every job below.
  #
  # A pull request's run tests the pull request merged into its base, and
  # `record` notes the tree it tested once everything has passed. A merge that
  # lands that same tree on main has nothing new to test, so the test jobs skip
  # and `dev` publishes it. A merge that lands anything else, because main moved
  # after the run or because the push came from no pull request, runs it all.
  tree:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
      passed: ${{ steps.passed.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tree under test
        id: hash
        # The tree, not the commit: a rebase merge makes new commits of the
        # same files.
        run: echo "hash=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Whether a pull request's run passed it
        id: passed
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.hash.outputs.hash }}
        # Only runs from this repository's own branches count: a fork's pull
        # request runs the workflow as the fork wrote it, which could upload
        # the name without testing anything. A failed lookup runs everything.
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=passed-$TREE" --jq '
            [.artifacts[] | select(.expired | not)
             | select(.workflow_run.head_repository_id == .workflow_run.repository_id)]
            | first | .workflow_run.id // empty') || run=""
          if [ -n "$run" ]; then
            echo "Every test passed on this tree in [run $run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run)." >> "$GITHUB_STEP_SUMMARY"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: tree
    if: needs.tree.outputs.passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install the project and its dev tools
        run: uv sync --dev --locked

      - name: Ruff
        run: uv run ruff check app tests tools

  # The other half of the two-way arrangement. This app pins a revision of
  # appcore, so its own tests prove nothing about appcore's current main —
  # appcore's CI runs THIS suite for that. What this job catches is the reverse:
  # a change here that assumes something appcore no longer does.
  appcore:
    needs: tree
    if: needs.tree.outputs.passed != 'true'
    runs-on: ubuntu-latest
    steps:
      # The revision is read from pyproject.toml, not copied here: without a
      # `ref` this tested appcore's main, which says nothing about the pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: The revision this app pins
        id: pin
        run: >-
          python3 -c 'import tomllib;
          print("rev=" + tomllib.load(open("pyproject.toml", "rb"))["tool"]["uv"]["sources"]["appcore"]["rev"])'
          >> "$GITHUB_OUTPUT"

      - name: Check out appcore at the revision this app pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jarrodruggiero/appcore
          ref: ${{ steps.pin.outputs.rev }}
          path: appcore
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install appcore and its dev tools
        working-directory: appcore
        run: uv sync --dev

      - name: Test appcore
        working-directory: appcore
        run: uv run pytest

  test:
    needs: tree
    if: needs.tree.outputs.passed != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject says `requires-python = ">=3.12"`, so every version that
        # claim covers is tested — all three were verified green before this
        # matrix was written. Narrow the claim if one ever has to be dropped;
        # do not quietly stop testing it.
        python: ["3.12", "3.13", "3.14"]
        # The app ships on SQLite and claims to run on Postgres. An untested
        # claim is worth nothing, so both are exercised.
        backend: [sqlite]
        include:
          # Postgres on the shipped interpreter only: the backend and the
          # interpreter are independent axes, and the full cross product would
          # be six jobs to tell us what four already do.
          #
          # "Shipped" means whatever the Dockerfile's base pin resolves to, and
          # tests/test_workflows.py holds this to it. Kept in step by hand, this
          # said 3.12 for as long as the base did, then the pin moved to 3.14
          # and this did not follow, so the interpreter the container actually
          # runs was the one combination never tested against Postgres.
          - python: "3.14"
            backend: postgres

    services:
      # Started for both matrix legs; the SQLite leg simply ignores it, which
      # is cheaper than duplicating the whole job to avoid one container.
      # Every image here comes through Google's mirror of Docker Hub: Docker
      # Hub rate-limits the addresses GitHub's runners share, and on
      # 2026-10-09 that failed every job before a test ran.
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stocktake_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stocktake_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install the project and its dev tools
        run: uv sync --dev --locked

      - name: Test (python ${{ matrix.python }}, ${{ matrix.backend }})
        env:
          STOCKTAKE_TEST_DB: ${{ matrix.backend }}
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: stocktake_test
          PGUSER: postgres
          PGPASSWORD: postgres
        # -p no:randomly and friends are deliberately absent: the suite is
        # order-independent by construction (each test gets its own database).
        # Coverage is enforced on this leg only — see pyproject's
        # [tool.coverage.report]. Measuring the same lines on all four matrix
        # legs would cost time and tell us nothing new.
        run: |
          if [ "${{ matrix.python }}-${{ matrix.backend }}" = "3.12-sqlite" ]; then
            uv run pytest tests -q --cov
          else
            uv run pytest tests -q
          fi

  image:
    # Build the image on every change so a broken Dockerfile is caught here
    # rather than at release time. Nothing is pushed — that is release.yml.
    needs: tree
    if: needs.tree.outputs.passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pinned for the same reason, and bumped by hand likewise.
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build (amd64 only — a PR does not need the full matrix)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: stocktake:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the suite inside the image
        # Proves the shipped layers and the tests agree, which is the whole
        # point of the Dockerfile's `test` stage.
        run: |
          docker build --target test -t stocktake:ci-test .
          docker run --rm stocktake:ci-test

  # Layout, measured in a real browser. Its own job because it takes minutes
  # rather than seconds, and because a failure here means something different
  # from a failing unit test: the code works, the page is unreadable.
  #
  # ubuntu-latest ships Google Chrome, so nothing is installed. The tests skip
  # themselves on a machine without one, which is what makes the same command
  # safe to run inside the image, where there is no browser.
  visual:
    needs: tree
    if: needs.tree.outputs.passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install the project and its dev tools
        run: uv sync --dev --locked

      - name: Confirm a browser is actually present
        # Without this a missing Chrome would skip all 57 tests and report
        # green — the job would pass by doing nothing, which is the failure
        # mode a visual check can least afford.
        run: |
          uv run python -c "
          from tools.browser import find_chrome
          found = find_chrome()
          print(found or 'NONE')
          raise SystemExit(0 if found else 'no browser on the runner')
          "

      - name: Every page at both widths
        run: uv run pytest tests -m visual -q

  hostile:
    # tests/test_hostile_input.py: every route, every field, values a form
    # cannot send. Its own job because it is a minute or two of requests, which
    # would slow every leg of `test`; both backends, because SQLite stores what
    # Postgres refuses and the test reads the rows back to see it.
    needs: tree
    if: needs.tree.outputs.passed != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stocktake_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stocktake_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install the project and its dev tools
        run: uv sync --dev --locked

      - name: Every route, with values a form cannot send (${{ matrix.backend }})
        env:
          STOCKTAKE_TEST_DB: ${{ matrix.backend }}
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: stocktake_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: uv run pytest tests -m hostile -q

  # Notes that everything above passed on this tree, for `tree` to find when
  # the tree lands on main. Only a pull request's run: it is the only kind
  # whose tree is merged later.
  record:
    if: github.event_name == 'pull_request'
    needs: [tree, lint, appcore, test, image, visual, hostile]
    runs-on: ubuntu-latest
    steps:
      - name: Name the tree
        env:
          TREE: ${{ needs.tree.outputs.hash }}
        run: echo "$TREE" > tree
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passed-${{ needs.tree.outputs.hash }}
          path: tree
          # A re-run uploads it again, under the same name.
          overwrite: true

  # The development channel. `dev` moves with main; releases are tagged and
  # publish `latest` (see release.yml). Two channels rather than two long-lived
  # branches: a `dev` branch would be just as public as this one, so it would
  # relocate the mess rather than remove it — history is kept clean by how a
  # pull request is merged, not by where the commits land.
  #
  # Only on a push to main, and only once everything above is green, in this
  # run or in the pull request's run that passed this same tree, so `dev`
  # always names something that passed the full suite.
  dev:
    # `!cancelled()` because naming `success()` leaves out the check Actions
    # otherwise adds, and the second half would publish a cancelled run.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled()
      && (success() || (needs.tree.outputs.passed == 'true'
      && !contains(needs.*.result, 'failure')))
    needs: [tree, lint, appcore, test, image, visual, hostile]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both architectures, like a release: `dev` is what gets deployed to try
      # something out, and an image that only runs on the machine that built it
      # is not much of a try-out.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # Pinned, as the image is: Dependabot does not read images given
          # to an action, so this is bumped by hand.
          image: mirror.gcr.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pinned for the same reason, and bumped by hand likewise.
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `dev` moves; `sha-<commit>` does not. Deploy the moving one to try
          # something, pin the immutable one when you need to know exactly what
          # is running. Neither is ever `latest`.
          tags: |
            type=raw,value=dev
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
