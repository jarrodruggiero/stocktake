# Publishes docs/ to GitHub Pages.
#
# The Pages site itself and the repo's website field are Terraform, in the
# private git-management workspace - not something to switch on by hand here.
# There is no special GitHub docs feature; this is a workflow that uploads a
# built site.
#
# The docs render on GitHub without this. If Pages is ever a nuisance, delete
# this file and nothing is lost but search and navigation.
name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

# Read-only, but for the job that deploys: the build installs and runs code.
permissions:
  contents: read

# Never two deploys at once; skip superseded runs rather than queueing them.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      # From uv.lock, as everything else is: `pip install mkdocs-material` took
      # whatever was newest. The docs group alone, so the project is not built.
      - run: uv sync --only-group docs --locked
      # --strict fails the build on a broken internal link, so a renamed page
      # cannot quietly leave a dead link in the nav.
      - run: uv run --no-sync mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish the site
      id-token: write   # prove to Pages that this run is the one publishing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1