# Publish a multi-arch image and the Helm chart to GitHub Container Registry
# when a version tag is pushed, and open a GitHub Release for it.
#
# Public-repo workflow: GitHub-hosted runners, ghcr.io, and the token GitHub
# issues to the job itself. No registry credentials to manage, and nothing
# that reaches into private infrastructure.
#
# Tagging is manual and deliberate — a release is a decision, not a side effect
# of a push:
#     git tag v1.0.0 && git push origin v1.0.0
# Publishing a release in GitHub's UI pushes the tag too. Its notes are then
# left exactly as written (decisions.md #129).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: write   # create the Release
  packages: write   # push the image and the chart to ghcr.io

jobs:
  # Never publish an image whose tests do not pass, even though CI has usually
  # run on the same commit already — a tag can point anywhere.
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stocktake_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stocktake_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        backend: [sqlite, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --dev
      # The same paths CI lints, held in step by `tests/test_workflows.py`:
      # `appcore` stayed here after it became a dependency, and a tag was the
      # first thing to run this workflow and find out.
      - run: uv run ruff check app tests tools
      - env:
          STOCKTAKE_TEST_DB: ${{ matrix.backend }}
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: stocktake_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: uv run pytest tests -q

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # `inputs.tag` is empty on a tag push and names the tag on a manual run.
      # Without it a dispatch would check out the default branch and publish
      # whatever happened to be there under a release tag's name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # QEMU so the arm64 leg can build on an amd64 runner. Slower than a
      # native builder, but it needs no infrastructure of its own — which is
      # the trade this workflow is meant to make.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 publishes 1.2.3, 1.2 and latest, so a compose file can
          # follow a minor line without chasing patches.
          #
          # `latest=auto` tags a release `latest` only when it is a semver and
          # NOT a prerelease — so `v1.0.0-rc1` publishes 1.0.0-rc1 and leaves
          # `latest` pointing at the last stable one, which is what every deploy
          # example in this repo pulls.
          flavor: |
            latest=auto
          # `value=` supplies the version on a manual run, where there is no
          # tag ref for the semver patterns to read.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image tags drop the leading `v` (metadata-action's {{version}}),
      # so the release notes must too — telling people to pull `:v0.64.0`
      # names a tag that was never pushed.
      - name: The version without its leading v
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The tag is the chart's version and its appVersion, which picks the
      # image an install runs. Neither is kept in Chart.yaml: a number kept by
      # hand said 0.64.0 for five releases (decisions.md #137). After the image,
      # so the chart never names one that is not there. Helm comes with the
      # runner; `helm version` records which one in the log.
      - name: Publish the Helm chart
        id: chart
        env:
          VERSION: ${{ steps.version.outputs.number }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm version
          helm package deploy/helm/stocktake --version "$VERSION" \
            --app-version "$VERSION" --destination "$RUNNER_TEMP"
          printf '%s' "$TOKEN" |
            helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/stocktake-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts"

      # The step below replaces an existing release's notes, so it runs only
      # when there is no release for this tag, drafts included. An API failure
      # stops the job rather than reading as "none". decisions.md #129.
      - name: Is there a release for this tag already?
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          url=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
                  --jq '.[] | select(.tag_name == env.TAG) | .html_url')
          if [ -n "$url" ]; then
            echo "Leaving the notes as written: $url"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the GitHub Release
        if: steps.existing.outputs.found == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Container image:

                docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.number }}

            Helm chart:

                helm install stocktake oci://ghcr.io/${{ github.repository_owner }}/charts/stocktake --version ${{ steps.version.outputs.number }}

            See the README for the docker-compose and Helm quickstarts.

            **This is not financial or tax advice.** Verify any figure you rely
            on, and check your tax position with your accountant.
