# Dependency updates for the public repository.
#
# Worth having on a self-hosted finance app: the people running it are not
# watching CVE feeds, so a PR arriving on its own is the difference between a
# patched instance and a forgotten one. CI (lint + tests on both backends +
# an image build) gates every one of these before it can be merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine minor/patch drift; anything major arrives on its
      # own, because that is the one worth reading properly.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
